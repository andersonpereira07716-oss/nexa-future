name: Gerar APK PWA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Inicializar Projeto Android Automaticamente
        run: |
          # Responde 'yes' automaticamente usando yes ou passando argumentos non-interactive se suportado, 
          # ou instalando o JDK manualmente antes.
          sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
          yes "" | bubblewrap init --manifest=https://nexa-future-eight.vercel.app/manifest.json --directory=android-app

      - name: Construir o APK
        run: |
          cd android-app
          bubblewrap build

      - name: Guardar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: nexa-future-apk
          path: android-app/*.apk
