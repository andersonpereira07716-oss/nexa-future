name: Gerar APK PWA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Descarregar e Instalar WebAPK / PWABuilder CLI Direto
        run: |
          npm install -g @pwabuilder/cli

      - name: Gerar Pacote APK com PWABuilder CLI
        run: |
          pwabuilder generate --url https://nexa-future-eight.vercel.app --name "NEXA FUTURE" --output ./apk-output || echo "Continuando..."

      - name: Procurar e Organizar APK
        run: |
          mkdir -p final-apk
          find . -name "*.apk" -exec cp {} final-apk/ \;

      - name: Guardar o APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: nexa-future-apk
          path: final-apk/*.apk
