name: Gerar APK PWA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Java (JDK 17) e Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          npm install -g @bubblewrap/cli

      - name: Criar Configuração TWA Automática
        run: |
          cat << 'CONFIG' > twa-manifest.json
          {
            "host": "nexa-future-eight.vercel.app",
            "name": "NEXA FUTURE",
            "short_name": "NexaFuture",
            "startUrl": "/",
            "themeColor": "#050b14",
            "backgroundColor": "#050b14",
            "bundleId": "com.nexafuture.app",
            "appTitle": "NEXA FUTURE",
            "fullScreen": true,
            "webManifestUrl": "https://nexa-future-eight.vercel.app/manifest.json",
            "generatorApp": "bubblewrap-cli"
          }
          CONFIG

      - name: Compilar o APK
        run: |
          # O comando echo "y" responde automaticamente a qualquer prompt interativo do bubblewrap
          echo "y" | bubblewrap build --manifest=twa-manifest.json

      - name: Guardar o APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: nexa-future-apk
          path: |
            app-release-signed.apk
            app-debug.apk
            *.apk
